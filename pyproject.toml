[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readiness"
version = "0.1.0"
description = "Model cards, risk register, NIST AI RMF mapping and GO / NO-GO decisions generated from live AI evaluation results."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
