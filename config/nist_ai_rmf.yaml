# NIST AI Risk Management Framework 1.0 subcategories referenced in this project.
# Text paraphrased from the NIST AI RMF Playbook (airc.nist.gov).
# `covered_by` lists how this project produces evidence for each one.

GOVERN:
  "GOVERN 1.3": { text: "Risk management activities align with the organisation's risk tolerance", covered_by: ["config/policy.yaml"] }
  "GOVERN 1.4": { text: "Standardised documentation of risks, testing results and deployment plans", covered_by: ["MODEL_CARD.md", "RISK_REGISTER.md"] }
  "GOVERN 1.5": { text: "Continuous monitoring and periodic review with defined frequency", covered_by: ["nightly evaluation + daily readiness refresh"] }
  "GOVERN 1.6": { text: "Inventory of AI systems and their artifacts is maintained", covered_by: ["config/systems/"] }
  "GOVERN 2.1": { text: "Roles and responsibilities for AI risk are documented", covered_by: ["risk owners in config/risks/", "sign_off in system card"] }
  "GOVERN 6.1": { text: "Policies address third-party AI systems, models and data", covered_by: ["linked risks"] }
MAP:
  "MAP 1.1": { text: "Intended purpose, users and context are understood and documented", covered_by: ["MODEL_CARD.md"] }
  "MAP 1.5": { text: "Organisational risk tolerances are determined and documented", covered_by: ["config/policy.yaml"] }
  "MAP 2.2": { text: "Knowledge limits and human oversight are documented", covered_by: ["known_limitations and human_oversight in system card"] }
  "MAP 3.3": { text: "Targeted application scope is specified and documented", covered_by: ["intended_use and out_of_scope in system card", "linked risks"] }
  "MAP 5.1": { text: "Likelihood and magnitude of each identified impact are documented", covered_by: ["config/risks/"] }
MEASURE:
  "MEASURE 1.1": { text: "Metrics are selected for the most significant risks first", covered_by: ["metric links in config/risks/"] }
  "MEASURE 2.1": { text: "Test sets, metrics and tools used for TEVV are documented", covered_by: ["evaluation section of the model card"] }
  "MEASURE 2.3": { text: "Performance is measured in conditions similar to deployment", covered_by: ["linked risks"] }
  "MEASURE 2.5": { text: "System is shown to be valid and reliable, with documented limits", covered_by: ["linked risks"] }
  "MEASURE 2.6": { text: "System is evaluated regularly for safety risks within tolerance", covered_by: ["linked risks"] }
  "MEASURE 2.7": { text: "Security and resilience are evaluated and documented", covered_by: ["linked risks"] }
  "MEASURE 2.8": { text: "Transparency and accountability risks are examined and documented", covered_by: ["linked risks"] }
  "MEASURE 2.9": { text: "Model output is explained and interpreted within context", covered_by: ["linked risks"] }
  "MEASURE 2.10": { text: "Privacy risk is examined and documented", covered_by: ["linked risks"] }
  "MEASURE 3.1": { text: "Existing and emergent risks are tracked over time in deployment", covered_by: ["linked risks", "metric trends on the dashboard"] }
MANAGE:
  "MANAGE 1.1": { text: "A determination is made whether the system achieves its purpose and should proceed", covered_by: ["RELEASE_DECISION.md"] }
  "MANAGE 1.2": { text: "Risk treatment is prioritised by impact and likelihood", covered_by: ["inherent risk scores"] }
  "MANAGE 1.4": { text: "Residual risks to downstream users are documented", covered_by: ["residual risk column", "risk acceptances"] }
  "MANAGE 2.4": { text: "Mechanisms exist to disengage systems with inconsistent performance", covered_by: ["NO-GO gate blocks release"] }
  "MANAGE 3.2": { text: "Pre-trained models are monitored as part of maintenance", covered_by: ["linked risks"] }
  "MANAGE 4.1": { text: "Post-deployment monitoring plans are implemented", covered_by: ["nightly evaluation", "linked risks"] }
